name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check sccs/ tests/

      - name: Ruff format check
        run: uv run ruff format --check sccs/ tests/

      - name: Mypy type check
        run: uv run mypy sccs/

      - name: Bandit security scan
        run: uv run bandit -r sccs/ -ll

  audit:
    # Kept out of `lint`: a new advisory is not a code defect, and it used to
    # turn the lint badge red. Audits the locked set, not what resolves today;
    # the project itself is not on PyPI under this lock, so it is skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Audit runtime dependencies (blocking)
        # What `pip install sccs` ships. A finding here fails the build.
        run: uv export --frozen --no-hashes --no-emit-project --no-dev | uvx pip-audit --disable-pip --no-deps -r /dev/stdin

      - name: Audit dev tooling (report only)
        # pytest, ruff, mypy, pre-commit and their chain (virtualenv, filelock …)
        # never reach users. A finding shows as a warning; fix it with
        # `uv lock --upgrade-package <name>` when convenient.
        continue-on-error: true
        run: uv export --frozen --no-hashes --no-emit-project --all-extras | uvx pip-audit --disable-pip --no-deps -r /dev/stdin

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests with coverage
        # Coverage floor lives in pyproject.toml [tool.coverage.report] —
        # single source of truth, no --cov-fail-under override here.
        run: uv run pytest --cov=sccs --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Verify package
        run: |
          uv venv
          uv pip install dist/*.whl
          uv run sccs --version
