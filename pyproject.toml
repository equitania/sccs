[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sccs"
version = "2.63.0"
description = "SkillsCommandsConfigsSync - Unified YAML-configured synchronization for Claude Code files"
readme = "README.md"
license = "AGPL-3.0"
authors = [
    { name = "Equitania Software GmbH", email = "info@equitania.de" }
]
maintainers = [
    { name = "Equitania Software GmbH", email = "info@equitania.de" }
]
keywords = [
    "claude",
    "claude-code",
    "skills",
    "commands",
    "sync",
    "configuration",
    "dotfiles"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0,<9.0.0",
    "rich>=13.0.0,<16.0.0",
    "PyYAML>=6.0,<7.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "questionary>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    # Capped below 2: mypy 2.0 (May 2026) changed defaults (--local-partial-types,
    # --strict-bytes, PEP 688) — the 2.x upgrade must be a deliberate, tested step,
    # not a silent `uv lock --upgrade` side effect. Bump cap + fix findings together.
    "mypy>=1.14.0,<2.0.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=4.0.0",
    "bandit>=1.9.0",
    # Test-only TOML parser for round-tripping the hand-rolled Codex agent
    # TOML emitter (Python 3.11+ uses stdlib tomllib instead).
    "tomli>=2.0.0,<3.0.0; python_version < '3.11'",
]

[project.scripts]
sccs = "sccs.cli:cli"

[project.urls]
Homepage = "https://github.com/equitania/sccs"
Repository = "https://github.com/equitania/sccs"
Documentation = "https://github.com/equitania/sccs#readme"
Issues = "https://github.com/equitania/sccs/issues"

[tool.hatch.build.targets.wheel]
packages = ["sccs"]

# Bundle the agent capability card into the wheel so `sccs capability-card`
# can serve it from an installed (non-editable) package.
[tool.hatch.build.targets.wheel.force-include]
"usage/AGENT.md" = "sccs/data/AGENT.md"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E203", "E266", "SIM102", "SIM105", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["sccs"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["sccs"]
omit = ["tests/*", "sccs/__main__.py"]

[tool.coverage.report]
# Single source of truth for the coverage floor — CI invokes pytest without
# --cov-fail-under so this value governs both local and CI runs. Current
# actual coverage is ~83%; floor sits a notch below to absorb platform
# variance (Linux CI vs macOS). merge.py (94%), engine.py (96%), cli.py (75%)
# and transfer/ui.py (100%) are now covered. output/console.py at 54% is the
# next weakest area — raise this floor further as it closes.
fail_under = 82
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
